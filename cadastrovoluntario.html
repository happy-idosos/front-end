<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - Happy Idosos</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-cadastrovoluntario.css">
</head>
<body>
    <!-- Back Button -->
    <button class="back-btn" onclick="window.history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
        </svg>
        Voltar
    </button>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="img/happyidosos.png" alt="Happy Idosos" class="logo">
            <h1>Cadastro de Voluntário</h1>
            <p>Transforme vidas e faça a diferença na vida dos idosos</p>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <form id="voluntarioForm" class="volunteer-form">
                <!-- Personal Data -->
                <div class="form-section">
                    <h3>👤 Dados Pessoais</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <div class="form-group">
                            <label for="idade">Idade *</label>
                            <input type="number" id="idade" name="idade" min="16" max="100" required>
                        </div>
                        <div class="form-group">
                            <label for="email">E-mail *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone *</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                        </div>
                    </div>
                </div>

                <!-- Address -->
                <div class="form-section">
                    <h3>📍 Endereço</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade *</label>
                            <input type="text" id="cidade" name="cidade" required>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado *</label>
                            <select id="estado" name="estado" required>
                                <option value="">Selecione</option>
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="BA">Bahia</option>
                                <option value="PE">Pernambuco</option>
                                <option value="CE">Ceará</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="PR">Paraná</option>
                                <option value="SC">Santa Catarina</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label for="endereco">Endereço Completo *</label>
                            <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro" required>
                        </div>
                    </div>
                </div>

                <!-- Skills and Availability -->
                <div class="form-section">
                    <h3>⭐ Habilidades e Disponibilidade</h3>
                    
                    <div class="form-group">
                        <label>Principais Habilidades *</label>
                        <div class="skills-grid">
                            <label class="skill-item">
                                <input type="checkbox" name="habilidades" value="Atividades Recreativas">
                                <span>🎯 Atividades Recreativas</span>
                            </label>
                            <label class="skill-item">
                                <input type="checkbox" name="habilidades" value="Leitura">
                                <span>📚 Leitura e Contação</span>
                            </label>
                            <label class="skill-item">
                                <input type="checkbox" name="habilidades" value="Música">
                                <span>🎵 Música e Canto</span>
                            </label>
                            <label class="skill-item">
                                <input type="checkbox" name="habilidades" value="Artesanato">
                                <span>🎨 Artesanato</span>
                            </label>
                            <label class="skill-item">
                                <input type="checkbox" name="habilidades" value="Jogos">
                                <span>🎲 Jogos e Entretenimento</span>
                            </label>
                            <label class="skill-item">
                                <input type="checkbox" name="habilidades" value="Cuidados">
                                <span>💊 Cuidados Básicos</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="disponibilidade">Disponibilidade *</label>
                            <select id="disponibilidade" name="disponibilidade" required>
                                <option value="">Selecione</option>
                                <option value="Manhã">Manhã (8h às 12h)</option>
                                <option value="Tarde">Tarde (13h às 17h)</option>
                                <option value="Noite">Noite (18h às 21h)</option>
                                <option value="Fins de Semana">Fins de Semana</option>
                                <option value="Flexível">Horário Flexível</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="frequencia">Frequência *</label>
                            <select id="frequencia" name="frequencia" required>
                                <option value="">Selecione</option>
                                <option value="1x por semana">1x por semana</option>
                                <option value="2x por semana">2x por semana</option>
                                <option value="Quinzenal">Quinzenal</option>
                                <option value="Mensal">Mensal</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="motivacao">Por que deseja ser voluntário? *</label>
                        <textarea id="motivacao" name="motivacao" rows="3" placeholder="Compartilhe sua motivação..." required></textarea>
                    </div>
                </div>

                <!-- Terms -->
                <div class="form-section">
                    <label class="checkbox-group">
                        <input type="checkbox" id="termos" name="termos" required>
                        <span class="checkmark"></span>
                        Aceito os <a href="#" class="link">Termos de Uso</a> e <a href="#" class="link">Política de Privacidade</a> *
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Cadastrar como Voluntário</span>
                    <span class="btn-loading">
                        <div class="spinner"></div>
                        Processando...
                    </span>
                </button>
            </form>

            <!-- Login Link -->
            <div class="login-link">
                <p>Já é cadastrado? <a href="loginvoluntario.html" class="link">Faça login aqui</a></p>
            </div>
        </div>
    </div>

    <script src="script.js">
      document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("voluntarioForm")
  const submitBtn = form.querySelector(".submit-btn")
  const btnText = submitBtn.querySelector(".btn-text")
  const btnLoading = submitBtn.querySelector(".btn-loading")

  // Input masks
  setupInputMasks()

  // Form validation
  setupFormValidation()

  // CEP lookup
  setupCepLookup()

  // Form submission
  form.addEventListener("submit", handleFormSubmit)

  function setupInputMasks() {
    // Phone mask
    const phoneInput = document.getElementById("telefone")
    phoneInput.addEventListener("input", (e) => {
      let value = e.target.value.replace(/\D/g, "")
      if (value.length <= 11) {
        value = value.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3")
        if (value.length < 14) {
          value = value.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3")
        }
      }
      e.target.value = value
    })

    // CEP mask
    const cepInput = document.getElementById("cep")
    cepInput.addEventListener("input", (e) => {
      let value = e.target.value.replace(/\D/g, "")
      value = value.replace(/(\d{5})(\d{3})/, "$1-$2")
      e.target.value = value
    })
  }

  function setupFormValidation() {
    const inputs = form.querySelectorAll("input[required], select[required], textarea[required]")

    inputs.forEach((input) => {
      input.addEventListener("blur", validateField)
      input.addEventListener("input", clearValidation)
    })

    // Validate skills (at least one checkbox must be checked)
    const skillsCheckboxes = form.querySelectorAll('input[name="habilidades"]')
    skillsCheckboxes.forEach((checkbox) => {
      checkbox.addEventListener("change", validateSkills)
    })
  }

  function validateField(e) {
    const field = e.target
    const value = field.value.trim()

    clearValidation(e)

    let isValid = true
    let message = ""

    // Required field validation
    if (field.hasAttribute("required") && !value) {
      isValid = false
      message = "Este campo é obrigatório."
    }

    // Specific field validations
    if (value && field.type === "email") {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      if (!emailRegex.test(value)) {
        isValid = false
        message = "Digite um e-mail válido."
      }
    }

    if (value && field.id === "telefone") {
      const phoneRegex = /^$$\d{2}$$ \d{4,5}-\d{4}$/
      if (!phoneRegex.test(value)) {
        isValid = false
        message = "Digite um telefone válido."
      }
    }

    if (value && field.id === "cep") {
      const cepRegex = /^\d{5}-\d{3}$/
      if (!cepRegex.test(value)) {
        isValid = false
        message = "Digite um CEP válido."
      }
    }

    if (value && field.id === "idade") {
      const idade = Number.parseInt(value)
      if (idade < 16 || idade > 100) {
        isValid = false
        message = "A idade deve estar entre 16 e 100 anos."
      }
    }

    // Apply validation classes and feedback
    if (!isValid) {
      field.classList.add("error")
      showFieldError(field, message)
    } else if (value) {
      field.classList.add("success")
    }

    return isValid
  }

  function validateSkills() {
    const checkboxes = form.querySelectorAll('input[name="habilidades"]')
    const isChecked = Array.from(checkboxes).some((cb) => cb.checked)

    const container = checkboxes[0].closest(".form-group")
    const existingError = container.querySelector(".error-message")

    if (existingError) {
      existingError.remove()
    }

    if (!isChecked) {
      const errorMsg = document.createElement("div")
      errorMsg.className = "error-message"
      errorMsg.textContent = "Selecione pelo menos uma habilidade."
      container.appendChild(errorMsg)
      return false
    }

    return true
  }

  function clearValidation(e) {
    const field = e.target
    field.classList.remove("error", "success")

    const errorMsg = field.parentNode.querySelector(".error-message")
    if (errorMsg) {
      errorMsg.remove()
    }
  }

  function showFieldError(field, message) {
    const errorMsg = document.createElement("div")
    errorMsg.className = "error-message"
    errorMsg.textContent = message
    field.parentNode.appendChild(errorMsg)
  }

  function setupCepLookup() {
    const cepInput = document.getElementById("cep")
    const enderecoInput = document.getElementById("endereco")
    const cidadeInput = document.getElementById("cidade")
    const estadoSelect = document.getElementById("estado")

    cepInput.addEventListener("blur", async function () {
      const cep = this.value.replace(/\D/g, "")

      if (cep.length === 8) {
        try {
          const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`)
          const data = await response.json()

          if (!data.erro) {
            enderecoInput.value = `${data.logradouro}, ${data.bairro}`
            cidadeInput.value = data.localidade
            estadoSelect.value = data.uf
          }
        } catch (error) {
          console.log("Erro ao buscar CEP:", error)
        }
      }
    })
  }

  async function handleFormSubmit(e) {
    e.preventDefault()

    // Validate all fields
    const inputs = form.querySelectorAll("input[required], select[required], textarea[required]")
    let isFormValid = true

    inputs.forEach((input) => {
      const fieldValid = validateField({ target: input })
      if (!fieldValid) isFormValid = false
    })

    // Validate skills
    const skillsValid = validateSkills()
    if (!skillsValid) isFormValid = false

    // Check terms acceptance
    const termsCheckbox = document.getElementById("termos")
    if (!termsCheckbox.checked) {
      isFormValid = false
      showAlert("Você deve aceitar os termos de uso para continuar.", "error")
    }

    if (!isFormValid) {
      showAlert("Por favor, corrija os erros no formulário antes de continuar.", "error")
      return
    }

    // Show loading state
    btnText.style.display = "none"
    btnLoading.style.display = "flex"
    submitBtn.disabled = true

    try {
      // Simulate API call
      await new Promise((resolve) => setTimeout(resolve, 2000))

      // Collect form data
      const formData = collectFormData()

      // Here you would normally send the data to your backend
      console.log("Form data:", formData)

      // Show success message
      showSuccessMessage()
    } catch (error) {
      console.error("Erro ao enviar formulário:", error)
      showAlert("Ocorreu um erro ao processar seu cadastro. Tente novamente.", "error")
    } finally {
      // Reset button state
      btnText.style.display = "inline"
      btnLoading.style.display = "none"
      submitBtn.disabled = false
    }
  }

  function collectFormData() {
    const formData = new FormData(form)
    const data = {}

    // Collect regular form fields
    for (const [key, value] of formData.entries()) {
      data[key] = value
    }

    // Collect skills (checkboxes)
    const skills = []
    const skillsCheckboxes = form.querySelectorAll('input[name="habilidades"]:checked')
    skillsCheckboxes.forEach((checkbox) => {
      skills.push(checkbox.value)
    })
    data.habilidades = skills

    return data
  }

  function showAlert(message, type) {
    // Remove existing alerts
    const existingAlert = form.querySelector(".alert")
    if (existingAlert) {
      existingAlert.remove()
    }

    const alert = document.createElement("div")
    alert.className = `alert alert-${type} fade-in`
    alert.textContent = message

    form.insertBefore(alert, form.firstChild)

    // Auto-remove after 5 seconds
    setTimeout(() => {
      if (alert.parentNode) {
        alert.remove()
      }
    }, 5000)
  }

  function showSuccessMessage() {
    // Clear form
    form.reset()

    // Remove all validation classes
    const validatedFields = form.querySelectorAll(".error, .success")
    validatedFields.forEach((field) => {
      field.classList.remove("error", "success")
    })

    // Remove all error messages
    const errorMessages = form.querySelectorAll(".error-message")
    errorMessages.forEach((msg) => msg.remove())

    // Show success message
    showAlert("Cadastro realizado com sucesso! Entraremos em contato em breve.", "success")

    // Scroll to top of form
    form.scrollIntoView({ behavior: "smooth", block: "start" })
  }
})

    </script>
</body>
</html>
